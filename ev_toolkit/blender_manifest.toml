schema_version = "1.0.0"

# The directory name must match this id for Blender to load it from a local repository.
id = "ev_toolkit"
version = "0.5.0"
name = "EV Toolkit"
tagline = "Everyday modeling and scene tools with configurable pie menus"
maintainer = "Evan Viera"
type = "add-on"

tags = ["User Interface", "Object", "Mesh", "Geometry Nodes"]

blender_version_min = "4.5.0"

license = ["SPDX:MIT"]
copyright = ["2023-2026 Evan Viera"]

[permissions]
files = "Import/export Geometry Nodes networks as JSON"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".*",
  "*.zip",
  "symbolic_link.txt",
]
